name: Z64 - Create assets

on:
  workflow_dispatch:
  pull_request_target:
    types:
      - closed

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: CristobalPenaloza/z64packer-create-assets@v1
        with:
          name: "Darunia's Joy"
          description: "Heeey!! What a nice tune! Just like that, my depression is all gone! Something just came over me! I suddenly wanted to dance like crazy! I am Darunia! I'm the big boss of the Gorons!"
          binaries-path: 'data/Music/'
          previews-path: 'previews/'
          avatar-url: 'https://avatars.githubusercontent.com/u/54688009?v=4'
